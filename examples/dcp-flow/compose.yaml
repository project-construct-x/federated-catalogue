name: fc-dcp-flow
services:
  fixtures:
    build: .
    networks:
      default:
        # Network alias only: hostname would also register one-off runners under this name.
        aliases: [dcp-fixtures]
    volumes:
      - ./.state:/state
      - ./:/examples
    healthcheck:
      test: [CMD, python, /app/flow.py, health]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dcp-local-only
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d catalogue]
      interval: 5s
      timeout: 3s
      retries: 20
  fuseki:
    build: ../../docker/fuseki
    environment:
      JAVA_OPTIONS: -Xmx512m
    command: [--tdb2, --loc=/fuseki/databases/ds, --update, /ds]
    volumes:
      - graph:/fuseki/databases
  catalogue:
    build:
      context: ../..
      dockerfile: examples/dcp-flow/Catalogue.Dockerfile
    env_file:
      - path: ./.state/catalogue.env
        required: false # generated by the init command before starting the catalogue
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogue
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: dcp-local-only
      GRAPHSTORE_IMPL: fuseki
      GRAPHSTORE_FUSEKI_URI: http://fuseki:3030/ds
      PUBLISHER_IMPL: none
      SUBSCRIBER_IMPL: none
      DATASTORE_FILE_PATH: /data
      FEDERATED_CATALOGUE_VERIFICATION_SIGNATURE_VERIFIER: local
      FEDERATED_CATALOGUE_VERIFICATION_VP_SIGNATURE: "true"
      FEDERATED_CATALOGUE_VERIFICATION_VC_SIGNATURE: "true"
      FEDERATED_CATALOGUE_ENABLED_TRUST_FRAMEWORKS: ""
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_EU_XFSC_FC: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
      MANAGEMENT_HEALTH_NEO4J_ENABLED: "false"
      SPRING_MVC_LOG_REQUEST_DETAILS: "false"
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - assets:/data
    depends_on:
      postgres:
        condition: service_healthy
      fixtures:
        condition: service_healthy
      fuseki:
        condition: service_started
  hurl:
    image: ghcr.io/orange-opensource/hurl:6.1.1
    profiles: [tools]
    volumes:
      - ./:/examples:ro
    working_dir: /examples
    entrypoint: [hurl]
volumes:
  database:
  graph:
  assets:
