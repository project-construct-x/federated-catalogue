services:
  key-server:
    container_name: "key-server"
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
      - --hostname=http://key-server:8080
      - --verbose
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - admin-keycloak-data:/opt/keycloak/data

volumes:
  admin-keycloak-data: