# Construct-X staging (STACKIT SKE: construct-x-dev)
#
# Base stack only: fc-service + Keycloak + Postgres + Fuseki.
# No demo portal (frontend). Neo4j is not part of this chart.
#
# Public URL: https://federated-catalogue.staging.construct-x.net/
#   - catalogue API at /
#   - Keycloak at /auth (same host)
#
# Ingress (STACKIT): class nginx, ClusterIssuer letsencrypt-staging, external-dns
# for federated-catalogue.staging.construct-x.net (TTL 300). TLS secret
# federated-catalogue-tls is shared by the catalogue and Keycloak ingresses.
#
# One-liner (from repo root):
#   helm repo add codecentric https://codecentric.github.io/helm-charts --force-update
#   helm dependency build deployment/helm/fc-service
#   helm upgrade --install fc-service deployment/helm/fc-service \
#     --kube-context construct-x-dev \
#     --namespace dev-01 \
#     -f deployment/helm/fc-service/values.yaml \
#     -f deployment/helm/extra-stages/construct-x-dev.yaml \
#     --server-side=true --force-conflicts
#
# Prerequisite: GitHub secrets KUBE_CONFIG + FC_KEYCLOAK_CLIENT_SECRET (see docs/ci-cd.md).
# CI patches fc-realm.json at deploy time so the Keycloak client secret is not committed.

hosts:
  fcService: "federated-catalogue.staging.construct-x.net"
  keycloak: "federated-catalogue.staging.construct-x.net"
  # unused while portal.enabled=false / did.enabled=false
  portal: "federated-catalogue.staging.construct-x.net"
  did: "federated-catalogue.staging.construct-x.net"

image:
  pullPolicy: Always
  tag: "dev"

# GHCR packages are private. CI refreshes this secret before each install.
imagePullSecrets:
  - name: ghcr-pull

fuseki:
  image:
    # CI publishes the branch tag (dev), not the chart default 5.5.0.
    tag: "dev"
    pullPolicy: Always

ingress:
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    external-dns.alpha.kubernetes.io/hostname: "federated-catalogue.staging.construct-x.net"
    external-dns.alpha.kubernetes.io/ttl: "300"
    # Base values.yaml sets Traefik annotations. Helm merges maps, so clear them
    # here; the ingress template omits empty values.
    traefik.ingress.kubernetes.io/router.entrypoints: ""
    traefik.ingress.kubernetes.io/service.sticky.cookie: ""
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: ""
  hosts:
    - host: "federated-catalogue.staging.construct-x.net"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: federated-catalogue-tls
      hosts:
        - "federated-catalogue.staging.construct-x.net"

keycloak:
  hostname:
    hostname: "federated-catalogue.staging.construct-x.net"
    strict: false
    strictBackchannel: false
  ingress:
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
      external-dns.alpha.kubernetes.io/hostname: "federated-catalogue.staging.construct-x.net"
      external-dns.alpha.kubernetes.io/ttl: "300"
    rules:
      - host: "federated-catalogue.staging.construct-x.net"
        paths:
          - path: /auth
            pathType: Prefix
    tls:
      - hosts:
          - "federated-catalogue.staging.construct-x.net"
        secretName: federated-catalogue-tls

portal:
  enabled: false

did:
  enabled: false

# Full env list (Helm replaces arrays). Fuseki only — no Neo4j. Keycloak DNS
# uses the short service name so it works in the deploy namespace (dev-01).
env:
  - name: DATASTORE_FILE_PATH
    value: /var/lib/fc-service/filestore
  - name: FEDERATED_CATALOGUE_VERIFICATION_SIGNATURES
    value: "true"
  - name: GRAPHSTORE_IMPL
    value: fuseki
  - name: GRAPHSTORE_FUSEKI_URI
    value: http://fc-fuseki:3030/ds
  # No Neo4j in this stage. The driver starter otherwise health-checks
  # localhost:7687 and /actuator/health stays 503, so Helm --wait never finishes.
  - name: MANAGEMENT_HEALTH_NEO4J_ENABLED
    value: "false"
  - name: KEYCLOAK_AUTH_SERVER_URL
    value: http://fc-keycloak-headless:8080/auth
  - name: KEYCLOAK_CREDENTIALS_SECRET
    valueFrom:
      secretKeyRef:
        name: fc-keycloak-client-secret
        key: keycloak_client_secret
  - name: SPRING_DATASOURCE_URL
    value: jdbc:postgresql://fc-postgres:5432/postgres
  - name: SPRING_DATASOURCE_USERNAME
    value: keycloak
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: fc-postgres
        key: password
