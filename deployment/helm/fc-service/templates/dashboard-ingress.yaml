{{- if and .Values.dashboard.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fc-service.dashboard.fullname" . }}
  labels:
    {{- include "fc-service.dashboard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with (index .Values.ingress.tls 0) }}
  tls:
    - hosts:
        - {{ $.Values.hosts.fcService | quote }}
      secretName: {{ .secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.hosts.fcService | quote }}
      http:
        paths:
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: {{ include "fc-service.dashboard.fullname" . }}
                port:
                  number: {{ .Values.dashboard.service.port }}
{{- end }}
