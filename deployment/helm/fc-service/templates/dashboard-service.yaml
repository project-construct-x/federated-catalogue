{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fc-service.dashboard.fullname" . }}
  labels:
    {{- include "fc-service.dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "fc-service.dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
