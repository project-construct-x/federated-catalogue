extends:
  - minimal

rules:
  # Every operation must declare its intended access boundary.
  rule/operation-access-category:
    subject:
      type: Operation
      property: x-access-category
    assertions:
      defined: true
      enum:
        - administration
        - dcp-machine
        - bootstrap-protocol
        - public
    severity: error

  # Hard gates — broken spec / inconsistent operations
  no-unresolved-refs: error
  no-identical-paths: warn
  no-ambiguous-paths: warn
  operation-operationId-unique: error
  operation-summary: error
  operation-tag-defined: error
  security-defined: error
  path-parameters-defined: error

  # Hygiene — flag, don't fail
  no-unused-components: warn

  # Deliberately disabled
  operation-2xx-response: off
  operation-4xx-response: off
  tag-description: off
  info-license: off
  info-contact: off
  no-empty-servers: off
  no-server-example.com: off
  no-server-trailing-slash: off
  operation-description: off
  parameter-description: off
